server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Images come from the product source's CDN; update img-src if the source changes.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://fakestoreapi.com data:; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Same origin for the browser: no CORS needed, and the API isn't exposed directly.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # Hashed build assets never change, so browsers can cache them for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Single-page app: unknown paths load index.html and the router takes over.
    location / {
        try_files $uri /index.html;
    }
}
